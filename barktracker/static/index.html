<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Barktracker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%231d2833'/><path d='M6 20h4l2-8 3 14 3-18 2 12h6' stroke='%23e2a03f' stroke-width='2.5' fill='none' stroke-linejoin='round'/></svg>">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="top">
  <a class="mark" href="#/">barktracker</a>
  <nav>
    <a href="#/" data-nav="overview">Overview</a>
    <a href="#/clips" data-nav="clips">Clips</a>
    <a href="#/dogs" data-nav="dogs">Dogs</a>
    <a href="#/report" data-nav="report">Report</a>
    <a href="#/settings" data-nav="settings">Settings</a>
  </nav>
</header>
<section class="beat" id="beat" data-state="idle" aria-label="Live listening status">
  <a class="beat-frame" id="beatFrame" href="#/live" aria-label="Open full-screen live view"><div class="beat-media" id="beatMedia"></div></a>
  <div class="beat-info">
    <p class="beat-title" role="status" aria-live="polite"><strong id="beatTitle">Connecting…</strong> <span id="beatSub"></span></p>
    <canvas class="beat-eq" id="beatEq" aria-hidden="true"></canvas>
  </div>
  <div class="splash" id="splash" aria-hidden="true"></div>
</section>
<main id="view"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/static/app.js"></script>
</body>
</html>
