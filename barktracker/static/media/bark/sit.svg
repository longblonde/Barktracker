<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
<style>
.head{transform-box:view-box;transform-origin:240px 140px;animation:h .42s ease-in-out infinite}
@keyframes h{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(-20deg) translateY(-4px)}}
.jaw{transform-box:view-box;transform-origin:270px 126px;animation:j .42s ease-in-out infinite}
@keyframes j{0%,100%{transform:rotate(8deg)}50%{transform:rotate(32deg)}}
.arc{fill:none;stroke:#c2453d;stroke-width:6;stroke-linecap:round;opacity:0;animation:a .84s ease-out infinite}
.a2{animation-delay:.14s}.a3{animation-delay:.28s}
@keyframes a{0%{opacity:0}30%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.head,.jaw{animation:none}.head{transform:rotate(-16deg)}.jaw{transform:rotate(26deg)}.arc{animation:none;opacity:.8}}
</style>
