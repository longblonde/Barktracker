<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
<style>
.head{transform-box:view-box;transform-origin:262px 140px;animation:h .38s ease-in-out infinite}
@keyframes h{50%{transform:rotate(-7deg) translateY(-3px)}}
.jaw{transform-box:view-box;transform-origin:304px 142px;animation:j .38s ease-in-out infinite}
@keyframes j{0%,100%{transform:rotate(6deg)}50%{transform:rotate(30deg)}}
.arc{fill:none;stroke:#c2453d;stroke-width:6;stroke-linecap:round;opacity:0;animation:a .76s ease-out infinite}
.a2{animation-delay:.12s}.a3{animation-delay:.24s}
@keyframes a{0%{opacity:0}30%{opacity:1}100%{opacity:0}}
.tail{transform-box:fill-box;transform-origin:100% 100%;animation:w .3s ease-in-out infinite}
@keyframes w{50%{transform:rotate(14deg)}}
@media (prefers-reduced-motion:reduce){.head,.jaw,.tail{animation:none}.arc{animation:none;opacity:.8}.jaw{transform:rotate(26deg)}}
</style>
