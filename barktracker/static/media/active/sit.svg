<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
<style>
.tail{transform-box:fill-box;transform-origin:100% 100%;animation:w 1.4s ease-in-out infinite}
@keyframes w{50%{transform:rotate(-18deg)}}
.eye{transform-box:fill-box;transform-origin:50% 50%;animation:k 5s infinite}
@keyframes k{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@media (prefers-reduced-motion:reduce){.tail,.eye{animation:none}}
</style>
